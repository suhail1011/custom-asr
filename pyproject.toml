[project]
name = "custom-asr"
version = "0.1.0"
description = "Local Nemotron streaming ASR with personal fine-tuning"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch",
    "torchaudio",
    "Cython",
    "packaging",
    "nemo_toolkit[asr]",
    "sounddevice",
    "soundfile",
    "jiwer",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
