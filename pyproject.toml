[project]
name = "custom-asr"
version = "0.1.0"
description = "Local Nemotron streaming ASR with personal fine-tuning"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "Cython",
    "packaging",
    "nemo_toolkit[asr]",
    "sounddevice",
    "soundfile",
    "jiwer",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/custom_asr"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
