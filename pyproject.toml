[project]
name = "custom-asr"
version = "0.1.0"
description = "Reproducible local URGENT 2024 ASR benchmarking"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.7,<2.8",
    "torchaudio>=2.7,<2.8",
    "Cython",
    "packaging",
    "nemo_toolkit[asr]",
    "soundfile",
    "jiwer",
    "numpy",
    "scipy",
    "pyarrow",
    "huggingface_hub",
]

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custom_asr_benchmark"]

[project.scripts]
urgent-asr = "custom_asr_benchmark.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
